name: update-material-symbols

on:
  schedule:
    - cron: '0 3 1 */3 *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-material-symbols
  cancel-in-progress: false

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  update:
    name: update
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next_tag.outputs.tag }}
      removed: ${{ steps.removed.outputs.names }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          key: ${{ github.repository }}-nuget-${{ hashFiles('**/*.csproj') }}
          path: ${{ env.NUGET_PACKAGES }}
      - name: Restore generator
        run: dotnet restore src/GoogleMaterialDesignIconsGenerator/GoogleMaterialDesignIconsGenerator.csproj
      - name: Generate Material Symbols
        run: dotnet run --project src/GoogleMaterialDesignIconsGenerator/GoogleMaterialDesignIconsGenerator.csproj --configuration Release --no-restore -- materialsymbols
      - name: Check Material Symbols font changes
        id: changes
        run: |
          if git diff --quiet -- src/MudBlazor.FontIcons.MaterialSymbols/wwwroot/font/; then
            echo "has_font_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_font_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: List removed icons
        if: steps.changes.outputs.has_font_changes == 'true'
        id: removed
        shell: bash
        run: |
          names() { grep -oE 'public const string [A-Za-z0-9_]+' | sed 's/public const string //' | sort -u; }
          dir=src/MudBlazor.FontIcons.MaterialSymbols
          removed="$(for f in Outlined Rounded Sharp; do
            comm -23 <(git show "HEAD:${dir}/${f}.cs" | names) <(names < "${dir}/${f}.cs")
          done | sort -u | paste -sd ' ')"
          if [[ -n "$removed" ]]; then
            echo "::warning::Google removed icons: ${removed}"
          fi
          echo "names=${removed}" >> "$GITHUB_OUTPUT"
      - name: Test
        if: steps.changes.outputs.has_font_changes == 'true'
        run: |
          dotnet restore test/MudBlazor.FontIcons.Tests/MudBlazor.FontIcons.Tests.csproj
          dotnet test test/MudBlazor.FontIcons.Tests/MudBlazor.FontIcons.Tests.csproj --configuration Release --no-restore
      - name: Commit Material Symbols update
        if: steps.changes.outputs.has_font_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MudBlazor.FontIcons.MaterialSymbols/
          git commit -m "chore: update material symbols"
      - name: Create next patch tag
        if: steps.changes.outputs.has_font_changes == 'true'
        id: next_tag
        shell: bash
        run: |
          git fetch --force --tags

          latest_tag="$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$' | sort -V | tail -n1)"
          if [[ -z "$latest_tag" ]]; then
            major=0
            minor=0
            patch=0
          else
            core_version="${latest_tag%%-*}"
            IFS='.' read -r major minor patch <<< "$core_version"
          fi

          next_patch=$((patch + 1))
          next_tag="${major}.${minor}.${next_patch}"
          while git show-ref --tags --verify --quiet "refs/tags/${next_tag}"; do
            next_patch=$((next_patch + 1))
            next_tag="${major}.${minor}.${next_patch}"
          done

          git tag "$next_tag"
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
      - name: Push commit and tag
        if: steps.changes.outputs.has_font_changes == 'true'
        env:
          TAG: ${{ steps.next_tag.outputs.tag }}
        # Atomic and non-forced: if master moved during the run, nothing is pushed.
        run: git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/${TAG}"
      - name: No font changes
        if: steps.changes.outputs.has_font_changes != 'true'
        run: echo "No changes in src/MudBlazor.FontIcons.MaterialSymbols/wwwroot/font/."

  # A tag pushed with GITHUB_TOKEN never triggers release.yml's push event, so call it directly.
  publish:
    needs: update
    if: needs.update.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.update.outputs.tag }}
    secrets:
      NUGET_KEY: ${{ secrets.NUGET_KEY }}

  github-release:
    needs: [update, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.update.outputs.tag }}
          REMOVED: ${{ needs.update.outputs.removed }}
        run: |
          notes="Updates Material Symbols to the latest icons from Google."
          if [[ -n "$REMOVED" ]]; then
            notes+=$'\n\n'"Google retired these icons, so their constants were removed: ${REMOVED}"
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes --notes "$notes"
